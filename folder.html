<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Bookmark Folder</title>
    <link rel="stylesheet" href="folder.css">
  </head>
  <body>
    <header class="header">
      <button id="up" class="up" type="button" aria-label="親フォルダへ" hidden>←</button>
      <button id="settings-back" class="settings-back" type="button" aria-label="ブックマーク一覧へ戻る" title="戻る" hidden>←</button>
      <div id="root-position" class="root-position" hidden></div>
      <div class="heading">
        <div id="folder-title" class="folder-title">Bookmark Shortcuts</div>
        <div id="folder-subtitle" class="folder-subtitle">Alt+数字でブックマークを開きます</div>
      </div>
      <button id="settings" class="settings" type="button" aria-label="拡張機能の設定を開く" title="設定">
        <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98L14.5 2.42A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.08.66-.08.98s.03.66.08.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.23.08.48 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
        </svg>
      </button>
    </header>

    <main>
      <div id="folder-view">
        <div id="message" class="message">ショートカットでフォルダを選択すると、ここに内容を表示します。</div>
        <div id="items" class="items" hidden></div>
      </div>
      <section id="settings-view" class="settings-view" hidden>
        <iframe id="settings-frame" class="settings-frame" title="Bookmark Shortcuts 設定"></iframe>
      </section>
    </main>

    <script src="platform.js"></script>
    <script src="settings-button.js"></script>
    <script type="module" src="folder.js"></script>
  </body>
</html>
