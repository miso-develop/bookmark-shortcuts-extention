<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Bookmark Shortcuts 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Bookmark Shortcuts</h1>
      <label class="option-row">
        <input id="always-new-tab" type="checkbox">
        <span>
          <strong>Enterで常に新しいタブで開く</strong>
          <small>OFFの場合、Enterは現在のタブ、Ctrl+Enterは新しいタブで開きます。</small>
        </span>
      </label>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
